<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>Silueta Blanca sobre Video</title>
  <script src="https://cdn.jsdelivr.net/npm/p5@1.9.3/lib/p5.min.js"></script>
  <style>
    body { margin:0; overflow:hidden; background:#888; }
    canvas { display:block; image-rendering: pixelated; }
  </style>
</head>
<body>

<script>
let cam;
let bgVideo;
let camW = 160;
let camH = 120;
let pixelSize = 6;
let thresholdDark = 100;
let videoPlaying = false;

function preload() {
  bgVideo = createVideo('video.mp4');
  bgVideo.volume(0);  // silencio
  bgVideo.hide();     // no mostrar el <video> HTML, lo dibujamos en canvas
}

function setup() {
  createCanvas(windowWidth, windowHeight);
  noStroke();

  cam = createCapture({ video: { facingMode: "environment" } });
  cam.size(camW, camH);
  cam.hide();
}

function draw() {
  background(128); // fondo gris por si el video no arranca

  // Dibujar video de fondo si ya está corriendo
  if (videoPlaying && bgVideo.elt.readyState >= 2) {
    image(bgVideo, 0, 0, width, height);
  }

  cam.loadPixels();
  for (let y = 0; y < camH; y++) {
    for (let x = 0; x < camW; x++) {
      let i = (x + y * camW) * 4;
      let r = cam.pixels[i];
      let g = cam.pixels[i + 1];
      let b = cam.pixels[i + 2];
      let brightness = (r + g + b) / 3;

      let sx = map(x, 0, camW, 0, width);
      let sy = map(y, 0, camH, 0, height);

      if (brightness < thresholdDark) {
        fill(255);
        rect(sx, sy, pixelSize, pixelSize);
      }
    }
  }
}

// Inicia video al tocar / click
function mousePressed() {
  if (!videoPlaying) {
    bgVideo.loop();
    videoPlaying = true;
  }
}

function windowResized() {
  resizeCanvas(windowWidth, windowHeight);
}
</script>

</body>
</html>
